# Bygger, tester og gir ut Medleser på en ren Windows-maskin hos GitHub.
# Start en utgivelse ved å lage og laste opp en tagg, f.eks.:  git tag v1.0.2 && git push origin v1.0.2
# Utgivelsesteksten hentes fra .github/release-notes/<tagg>.md.
name: Bygg og utgi Medleser

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: Medleser
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Lag Python-miljø
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r requirements-dev.txt

      - name: Installer Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Kontroller at de låste stemmefilene finnes uendret
        run: .venv\Scripts\python.exe -m pytest -m integration tests/integration/test_piper_pins_live.py -q

      - name: Bygg (tester, PyInstaller, selvtest med stemmenedlasting, installasjonsfil)
        env:
          MEDLESER_SELFTEST_DOWNLOAD: "1"
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\build_windows.ps1
          if ($LASTEXITCODE -ne 0) { throw "Bygget feilet." }

      - name: Vis selvtest
        if: always()
        run: if (Test-Path dist\selftest.json) { Get-Content dist\selftest.json }

      - name: Kontroller versjonsnummer mot taggen
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if (-not (Test-Path "dist\Medleser-Setup-$version.exe")) { throw "Fant ikke dist\Medleser-Setup-$version.exe – stemmer versjonen i koden med taggen?" }

      - name: Lag utgivelse
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          gh release create $tag "dist\Medleser-Setup-$version.exe" "dist\Brukerveiledning.pdf" "dist\Installasjonsveiledning.pdf" `
            --title "Medleser $version" --notes-file "..\.github\release-notes\$tag.md" --latest

      - name: Last opp byggefiler (også uten utgivelse)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: medleser-windows
          path: |
            Medleser/dist/Medleser-Setup-*.exe
            Medleser/dist/selftest.json
          if-no-files-found: ignore
